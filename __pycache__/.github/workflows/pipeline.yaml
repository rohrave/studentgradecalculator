name: Student Kubernetes CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
    # 1. Download the code from your repository into the runner environment
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # 2. Set up the specific Python engine version required
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    # 3. Download dependencies securely from your requirements.txt
    - name: Install Project Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Execute automated tests using pytest to confirm code stability
    - name: Run Automated Tests
      run: python -m pytest test_app.py -v

    # 5. Connect securely to Docker Hub using the secrets you configured in Step 1
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}

    # 6. Extract a unique short identifier from the Git commit to act as a unique version tag
    - name: Generate Unique Version Tag
      id: vars
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    # 7. Compile the container image and upload it to Docker Hub with unique identifiers
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/student-k8s-demo:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/student-k8s-demo:${{ steps.vars.outputs.sha_short }}
